<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <!-- 모바일 최적화 -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Rimini Day | VMware 유지보수, 더 많은 선택권을 확보하는 로드맵</title>

  <meta
    name="description"
    content="VMware 비용 최적화부터 유지보수 대안, 보안 전략까지. Rimini Day에 초대합니다."
  >

  <!-- 카카오톡 및 SNS 링크 미리보기 -->
  <meta
    property="og:title"
    content="Rimini Day | VMware 유지보수, 더 많은 선택권을 확보하는 로드맵"
  >

  <meta
    property="og:description"
    content="VMware 비용 최적화부터 유지보수 대안, 보안 전략까지. Rimini Day에 초대합니다."
  >

  <!-- 카카오톡 전용 썸네일 -->
  <meta
    property="og:image"
    content="https://wowshot.github.io/Rimini-Day/riministreetthumbnail.png"
  >

  <meta
    property="og:image:secure_url"
    content="https://wowshot.github.io/Rimini-Day/riministreetthumbnail.png"
  >

  <meta
    property="og:image:type"
    content="image/png"
  >

  <meta
    property="og:image:alt"
    content="Rimini Day VMware 특별 세미나"
  >

  <meta
    property="og:url"
    content="https://wowshot.github.io/Rimini-Day/"
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:locale"
    content="ko_KR"
  >

  <!-- X 및 기타 SNS 미리보기 -->
  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="Rimini Day | VMware 유지보수, 더 많은 선택권을 확보하는 로드맵"
  >

  <meta
    name="twitter:description"
    content="VMware 비용 최적화부터 유지보수 대안, 보안 전략까지. Rimini Day에 초대합니다."
  >

  <meta
    name="twitter:image"
    content="https://wowshot.github.io/Rimini-Day/riministreetthumbnail.png"
  >

  <!-- Google Form으로 자동 이동 -->
  <meta
    http-equiv="refresh"
    content="2; url=https://docs.google.com/forms/d/e/1FAIpQLSc8xQY3uZBJFsHaMtxjtnpGHtrZtwPneu9IHx4Q0HNo-apZzw/viewform"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        Arial,
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        sans-serif;
      background-color: #f4f6f8;
      color: #202124;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: 100%;
      max-width: 720px;
      min-height: 100vh;
      margin: 0 auto;
      background-color: #ffffff;
    }

    /* 웹페이지 본문 이미지 */
    .hero-image {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
    }

    .content {
      padding:
        28px
        24px
        calc(40px + env(safe-area-inset-bottom));
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.3;
      font-weight: 700;
    }

    h2 {
      margin: 0 0 20px;
      font-size: 20px;
      line-height: 1.5;
      font-weight: 600;
      word-break: keep-all;
    }

    .description {
      margin: 0 0 12px;
      font-size: 16px;
      line-height: 1.7;
      color: #4b5563;
      word-break: keep-all;
    }

    .redirect-message {
      margin: 0 0 24px;
      font-size: 14px;
      line-height: 1.6;
      color: #6b7280;
    }

    .button {
      display: block;
      width: 100%;
      max-width: 360px;
      min-height: 52px;
      margin: 0 auto;
      padding: 15px 20px;
      border-radius: 8px;
      background-color: #0057b8;
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.3;
      text-align: center;
      text-decoration: none;
    }

    .button:active {
      background-color: #00438f;
    }

    @media (max-width: 480px) {
      .content {
        padding:
          22px
          18px
          calc(32px + env(safe-area-inset-bottom));
      }

      h1 {
        font-size: 24px;
      }

      h2 {
        font-size: 18px;
      }

      .description {
        font-size: 15px;
      }

      .button {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <!-- 본문 이미지: 카카오톡 썸네일과 별도 -->
    <img
      class="hero-image"
      src="Riminiday_VMware_ABM.png"
      alt="Rimini Day VMware 유지보수 Exclusive Seminar"
    >

    <section class="content">
      <h1>Rimini Day</h1>

      <h2>
        VMware 유지보수,<br>
        더 많은 선택권을 확보하는 로드맵
      </h2>

      <p class="description">
        VMware 비용 최적화부터 유지보수 대안과 보안 전략까지,
        새로운 선택지를 확인해 보세요.
      </p>

      <p class="redirect-message">
        잠시 후 참석 신청 페이지로 이동합니다.
      </p>

      <a
        class="button"
        href="https://docs.google.com/forms/d/e/1FAIpQLSc8xQY3uZBJFsHaMtxjtnpGHtrZtwPneu9IHx4Q0HNo-apZzw/viewform"
      >
        참석 신청하기
      </a>
    </section>

  </main>
</body>
</html>
